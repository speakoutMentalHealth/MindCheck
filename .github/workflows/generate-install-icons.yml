name: Prepare approved SpeakOut install icons
on:
  push:
    branches:
      - fix/speakout-install-logo-20261103
    paths:
      - icons/speakout-install-logo-source.jpg
      - scripts/generate_install_icons.py
      - .github/workflows/generate-install-icons.yml
permissions:
  contents: write
jobs:
  create-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image generator
        run: python -m pip install 'Pillow==11.3.0'
      - name: Render approved image assets
        run: python scripts/generate_install_icons.py
      - name: Commit generated icon files to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/mindcheck-192.png icons/mindcheck-512.png icons/mindcheck-512-maskable.png icons/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Icon binaries are already up to date."
          else
            git commit -m "assets(pwa): publish approved round SpeakOut installation icons"
            git push origin HEAD:fix/speakout-install-logo-20261103
          fi

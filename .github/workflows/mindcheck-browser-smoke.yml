name: MindCheck browser smoke tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'become-a-counsellor.html'
      - 'training-hub.html'
      - 'resources.html'
      - 'sw.js'
      - 'css/**'
      - 'scripts/counsellor-pathway-smoke.cjs'
      - 'scripts/training-centre-smoke.cjs'
      - 'js/**'
      - '*.css'
      - 'scripts/browser-smoke.cjs'
      - 'scripts/language-switch-smoke.cjs'
      - 'scripts/translation-coverage-smoke.cjs'
      - 'scripts/breathing-studio-smoke.cjs'
      - 'scripts/compact-home-smoke.cjs'
      - 'scripts/phone-experience-smoke.cjs'
      - 'scripts/calm-studio-smoke.cjs'
      - 'scripts/monitoring-receipt-smoke.cjs'
      - '*.html'
      - '.github/workflows/mindcheck-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Check counsellor pathway interactions and accessibility
        run: node scripts/counsellor-pathway-smoke.cjs
      - name: Check Training Centre learning flow and accessibility
        run: node scripts/training-centre-smoke.cjs
      - name: Check language switch on every page
        run: node scripts/language-switch-smoke.cjs
      - name: Check assessment and wellness translation coverage
        run: node scripts/translation-coverage-smoke.cjs
      - name: Check breathing studio sessions and grounding
        run: node scripts/breathing-studio-smoke.cjs
      - name: Check compact home and full-screen tools
        run: node scripts/compact-home-smoke.cjs
      - name: Check phone installation handoff and compact breathing
        run: node scripts/phone-experience-smoke.cjs
      - name: Check calm activities, sound consent and mobile layout
        run: node scripts/calm-studio-smoke.cjs
      - name: Check monitoring receipt wording and local backup
        run: node scripts/monitoring-receipt-smoke.cjs
      - name: Run responsive browser smoke suite
        run: node scripts/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counsellor-pathway-preview
          path: artifacts/counsellor-pathway
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-centre-preview
          path: artifacts/training-centre
          retention-days: 14

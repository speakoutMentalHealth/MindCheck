name: MindCheck browser smoke tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/**'
      - '*.css'
      - 'scripts/browser-smoke.cjs'
      - '.github/workflows/mindcheck-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run responsive browser smoke suite
        run: node scripts/browser-smoke.cjs

name: MindCheck entitlement tests
on:
  push:
    branches: [feature/age-based-entry-20261024]
  pull_request:
    paths:
      - 'server/guide/age-entitlement.mjs'
      - 'server/guide/age-entitlement.test.mjs'
jobs:
  entitlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/guide/age-entitlement.test.mjs

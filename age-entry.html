<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315d46"><title>Choose your MindCheck experience</title><link rel="stylesheet" href="mc-theme.css"><style>
:root{font-family:system-ui,sans-serif;color:#123d32;background:#f3faf6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(100%,480px);background:white;border-radius:24px;padding:28px;box-shadow:0 12px 42px #183b2818}h1{margin:0 0 8px;font-size:1.8rem}p{line-height:1.5;color:#405c51}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}button{font:inherit;cursor:pointer;border-radius:14px;padding:16px;border:2px solid #d1e4d9;background:#f8fcfa;color:#123d32;font-weight:700}button[aria-pressed=true]{border-color:#247d57;background:#e8f6ee}button:focus-visible,input:focus-visible{outline:3px solid #257d58;outline-offset:3px}label{display:block;font-weight:700;margin:16px 0 8px}input{width:100%;padding:14px;border:1px solid #9ab5a6;border-radius:12px;font:inherit}#continue{width:100%;background:#236a4c;color:white;margin-top:18px}#continue:disabled{opacity:.55;cursor:not-allowed}.error{color:#9a1c1c;min-height:1.5em}.small{font-size:.85rem}</style></head><body><main>
<a href="https://speakoutmentalhealth.org/">← SpeakOut website</a><h1>Choose your experience</h1><p>MindCheck provides age-appropriate wellbeing resources.</p>
<div class="choices" role="group" aria-label="Experience"><button type="button" data-choice="adult" aria-pressed="false">18+ Adults</button><button type="button" data-choice="youth" aria-pressed="false">Under 18</button></div>
<form id="age-form" hidden><label for="age">Enter your age</label><input id="age" type="number" min="1" max="120" step="1" required inputmode="numeric" placeholder="e.g. 24"><p class="small">No login or date of birth needed. Your age stays in this tab.</p><p class="error" id="message" role="alert"></p><button id="continue" type="submit" disabled>Continue</button></form>
<p class="small">For a child or teenager, a trusted adult may need to help with consent and support. No age or date of birth is sent to a server.</p>
</main><script>
(()=>{'use strict';
const form=document.getElementById('age-form'),input=document.getElementById('age'),message=document.getElementById('message');
document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{
 const adult=button.dataset.choice==='adult';
 document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 message.textContent='';
 if(!adult){location.assign('youth.html');return;}
 form.hidden=false;document.getElementById('continue').disabled=false;input.focus();
}));
form.addEventListener('submit',event=>{
 event.preventDefault();message.textContent='';
 const value=input.value.trim(),age=Number(value);
 if(!/^\\d{1,3}$/.test(value)||!Number.isInteger(age)||age<1||age>120){message.textContent='Enter your age in whole years (1–120).';return;}
 if(age<18){location.assign('youth.html');return;}
 try{sessionStorage.setItem('mc-age-entry-adult','1');}catch(_){}
 location.assign('index.html');
});
})();
</script></body></html>
